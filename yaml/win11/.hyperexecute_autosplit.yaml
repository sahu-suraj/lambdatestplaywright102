---
version: "0.1"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90
runson: win11
autosplit: true
retryOnFailure: false
maxRetries: 1
concurrency: 2
pre:
  - npm install
  - npx playwright install
cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules
testDiscovery:
  type: raw
  mode: dynamic
  command: grep -lr 'describe' tests
testRunnerCommand: npx playwright test $test

jobLabel: [playwright-VanillaJS, win11, autosplit]
env:
  LT_USERNAME: ${{.secrets.LT_USERNAME}}
  LT_ACCESS_KEY: ${{.secrets.LT_ACCESS_KEY}} 

report: true
partialReports:
  frameworkName: playwright
  location: playwright-report
  type: html
